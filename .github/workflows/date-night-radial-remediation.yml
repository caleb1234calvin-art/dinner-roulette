name: Radial slider remediation
on:
  push:
    branches: [fix/date-night-radial-loading-browser-acceptance-remediation-1]
    paths:
      - src/components/ui/slider.tsx
      - scripts/slider-accessibility-browser.mjs
      - scripts/test-support/slider-accessibility-fixture.tsx
      - .github/workflows/date-night-radial-remediation.yml
permissions:
  contents: read
jobs:
  slider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Shared Slider accessibility regression
        run: node scripts/slider-accessibility-browser.mjs
      - name: Safe auth-enabled migration-free build and proof
        env:
          VITE_AUTH_ENABLED: "true"
        run: |
          node scripts/browser-build-proof.mjs capture
          node scripts/with-app-env.mjs node node_modules/vite/bin/vite.js build --mode production
          node scripts/browser-build-proof.mjs complete
          node scripts/browser-build-proof.mjs verify
      - name: Fresh controlled radial acceptance from scenario 1
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          DATE_NIGHT_RADIAL_OUTPUT: /tmp/pfu-radial-remediation-controlled
        run: node scripts/date-night-radial-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radial-remediation-evidence
          path: |
            /tmp/pfu-slider-accessibility
            /tmp/pfu-radial-remediation-controlled
          retention-days: 7
