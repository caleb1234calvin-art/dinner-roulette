name: Pick For Us Android Release Readiness

on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Build an upload-key-signed bundle (requires protected signing environment)
        type: boolean
        default: false
  push:
    branches: [polish/pre-google-play-pass-1, "feature/android-*"]
    paths:
      - "android/**"
      - "native-android/**"
      - "native-web/**"
      - "capacitor.config.json"
      - "package*.json"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "native-android/**"
      - "native-web/**"
      - "capacitor.config.json"
      - "package*.json"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record source revision
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install -r native-android/requirements.txt
      - name: Validate source, identity, icons, and regressions
        run: |
          npm run typecheck
          npm test
          npm run audit:casinos
          npm run android:check
          python3 -m unittest discover -s native-android -p 'test_*.py'
          npx eslint scripts/check-android.mjs scripts/android-release.test.mjs src/components/settings-page.tsx
      - name: Validate web production compilation without migrations
        env:
          VITE_AUTH_ENABLED: "true"
        run: node scripts/with-app-env.mjs node node_modules/vite/bin/vite.js build --mode production
      - name: Sync committed native project
        run: |
          npm run android:sync
          git diff --exit-code -- android capacitor.config.json
      - name: Verify missing upload key fails closed
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:bundleRelease > signing-guard.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'Release signing is missing.' signing-guard.log
          echo 'PASS: unsigned normal release was rejected by the signing guard'
      - name: Validate Gradle and generate release bundle plus development APK
        working-directory: android
        run: ./gradlew --no-daemon lintRelease testReleaseUnitTest bundleRelease assembleDebug -PallowUnsignedRelease=true
      - name: Inspect unsigned release bundle
        run: |
          mkdir -p artifacts
          python3 scripts/verify-android-bundle.py android/app/build/outputs/bundle/release/app-release.aab --expect unsigned --output artifacts/android-bundle-verification.json
          cp android/signing-guard.log artifacts/signing-guard.log
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/PickForUs-unsigned.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/PickForUs-debug.apk
          git rev-parse HEAD > artifacts/source-revision.txt
          sha256sum artifacts/*.aab artifacts/*.apk > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS
          python3 - <<'PY'
          import collections, json, xml.etree.ElementTree as ET
          report = ET.parse("android/app/build/reports/lint-results-release.xml").getroot()
          issues = [{"id": issue.get("id"), "severity": issue.get("severity"), "message": issue.get("message")} for issue in report.findall("issue")]
          summary = {"counts": dict(collections.Counter(issue["severity"] for issue in issues)), "issues": issues}
          print("Android app lint summary:", json.dumps(summary, indent=2))
          with open("artifacts/android-lint-summary.json", "w") as output:
              json.dump(summary, output, indent=2)
          PY
      - name: Preserve build artifacts (no public release or Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: PickForUs-Android-validation-${{ github.sha }}
          path: |
            artifacts/*.aab
            artifacts/*.apk
            artifacts/*.json
            artifacts/*.manifest.xml
            artifacts/signing-guard.log
            artifacts/source-revision.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Android lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PickForUs-Android-lint-${{ github.sha }}
          path: android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14

  # This job NEVER runs on a push or pull request. No publishing permissions exist.
  sign-upload-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    needs: validate-android
    environment: android-upload-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - name: Build with protected upload key and remove temporary key
        env:
          PICKFORUS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PICKFORUS_UPLOAD_KEYSTORE_BASE64 }}
          PICKFORUS_UPLOAD_STORE_PASSWORD: ${{ secrets.PICKFORUS_UPLOAD_STORE_PASSWORD }}
          PICKFORUS_UPLOAD_KEY_ALIAS: ${{ secrets.PICKFORUS_UPLOAD_KEY_ALIAS }}
          PICKFORUS_UPLOAD_KEY_PASSWORD: ${{ secrets.PICKFORUS_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PICKFORUS_UPLOAD_KEYSTORE_BASE64"
          test -n "$PICKFORUS_UPLOAD_STORE_PASSWORD"
          test -n "$PICKFORUS_UPLOAD_KEY_ALIAS"
          test -n "$PICKFORUS_UPLOAD_KEY_PASSWORD"
          umask 077
          export PICKFORUS_UPLOAD_STORE_FILE
          PICKFORUS_UPLOAD_STORE_FILE="$(mktemp "$RUNNER_TEMP/pickforus-upload-XXXXXX.jks")"
          trap 'rm -f "$PICKFORUS_UPLOAD_STORE_FILE"' EXIT
          printf '%s' "$PICKFORUS_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$PICKFORUS_UPLOAD_STORE_FILE"
          cd android
          ./gradlew --no-daemon bundleRelease
      - name: Verify signed bundle without uploading
        run: |
          mkdir -p artifacts
          python3 scripts/verify-android-bundle.py android/app/build/outputs/bundle/release/app-release.aab --expect signed --output artifacts/android-bundle-verification.json
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/PickForUs-upload-signed.aab
          git rev-parse HEAD > artifacts/source-revision.txt
          sha256sum artifacts/*.aab > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: PickForUs-upload-signed-${{ github.sha }}
          path: |
            artifacts/*.aab
            artifacts/*.apk
            artifacts/*.json
            artifacts/*.manifest.xml
            artifacts/signing-guard.log
            artifacts/source-revision.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
