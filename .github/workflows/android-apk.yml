name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/android-*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Dinner Roulette launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Image.open("native-android/icon.jpg").convert("RGB")
          source = ImageOps.fit(source, (512, 512), method=Image.Resampling.LANCZOS)

          launcher_sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          foreground_sizes = {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432,
          }

          for density, size in launcher_sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", format="PNG", optimize=True)
              icon.save(folder / "ic_launcher_round.png", format="PNG", optimize=True)

          for density, size in foreground_sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              foreground = source.resize((size, size), Image.Resampling.LANCZOS)
              foreground.save(folder / "ic_launcher_foreground.png", format="PNG", optimize=True)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DinnerRoulette.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinnerRoulette-Android
          path: artifacts/DinnerRoulette.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/android-direct-download'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest \
              --target "$GITHUB_SHA" \
              --title "Dinner Roulette for Android" \
              --notes "Direct Android download for Dinner Roulette."
          fi
          gh release upload android-latest artifacts/DinnerRoulette.apk --clobber
