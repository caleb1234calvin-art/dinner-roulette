name: Validate Dinner Integration

on:
  push:
    branches:
      - feature/dinner-icon-pack-1
      - integration/active-work-pass-1
  pull_request:
    branches:
      - main
      - integration/active-work-pass-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record validated commit
        run: git rev-parse HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Casino audit regression tests
        run: node --test scripts/casino-*.test.mjs

      - name: Audit curated casino catalog
        run: |
          node scripts/audit-casino-catalog.mjs --inventory
          node scripts/audit-national-coverage.mjs

      - name: Build development bundle
        run: npm run build:dev

      - name: Build production-mode bundle without database migrations
        env:
          VITE_AUTH_ENABLED: "true"
        run: |
          node scripts/browser-build-proof.mjs capture
          node scripts/with-app-env.mjs node node_modules/vite/bin/vite.js build --mode production
          node scripts/browser-build-proof.mjs complete

      - name: Repository and application tests
        run: npm test

      - name: Verify Dinner icon packs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          keys = [
              "burger", "pizza", "mexican", "chinese", "japanese",
              "italian", "steakhouse", "bbq", "chicken", "cafe-bakery",
              "dessert", "seafood", "buffet", "breakfast", "fallback",
          ]

          missing = []
          for theme in ("dark", "light"):
              for key in keys:
                  path = Path("public/dinner-icons") / theme / f"{key}.jpg"
                  if not path.is_file() or path.stat().st_size == 0:
                      missing.append(str(path))

          if missing:
              raise SystemExit("Missing Dinner icon assets:\n" + "\n".join(missing))

          print("Verified 30 Dinner icon assets: 15 dark + 15 light")
          PY

      - name: Preserve check build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-check-build-proof
          path: audit/browser-results/build-proof.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Independent suites own their runner, ports, build proof, and evidence.
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        suite:
          - casino
          - location
          - date-night-radial
          - seasonal-two
          - seasonal-completeness-v1
          - seasonal-ten
          - seasonal-cumulative
          - seasonal-astra
          - seasonal-astra-extras
          - seasonal-phase4
          - seasonal-next-missouri
          - seasonal-hold-cleanup
          - seasonal-ranked-holds
          - seasonal-regional-wave1
          - geometry
          - legal-support

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record validated commit
        run: git rev-parse HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production-mode bundle without database migrations
        env:
          VITE_AUTH_ENABLED: "true"
        run: |
          node scripts/browser-build-proof.mjs capture
          node scripts/with-app-env.mjs node node_modules/vite/bin/vite.js build --mode production
          node scripts/browser-build-proof.mjs complete

      - name: Install Chromium for disposable local browser validation
        run: npx playwright install --with-deps chromium

      - name: Verify Legal and Support routes, keyboard behavior and narrow layouts
        if: matrix.suite == 'legal-support'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
        run: node scripts/legal-support-browser.mjs

      - name: Exercise casino experience in local Chromium
        if: matrix.suite == 'casino'
        env:
          VITE_AUTH_ENABLED: "true"
        run: node scripts/casino-browser-smoke.mjs

      - name: Exercise country-aware location flow in local Chromium
        if: matrix.suite == 'location'
        env:
          VITE_AUTH_ENABLED: "true"
          LOCATION_BROWSER_OUTPUT: audit/browser-results/location
        run: node scripts/location-browser.mjs

      - name: Regress ordinary Date Night progressive loading and local controls
        if: matrix.suite == 'date-night-radial'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          DATE_NIGHT_RADIAL_OUTPUT: audit/browser-results/date-night-radial
        run: node scripts/date-night-radial-browser.mjs

      - name: Exercise integrated two-record seasonal experience in local Chromium
        if: matrix.suite == 'seasonal-two'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
        run: node scripts/missouri-two-record-browser.mjs

      - name: Exercise seasonal listing completeness V1 in local Chromium
        if: matrix.suite == 'seasonal-completeness-v1'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
        run: node scripts/seasonal-completeness-v1-browser.mjs

      - name: Exercise reviewed ten-record seasonal batch in local Chromium
        if: matrix.suite == 'seasonal-ten'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Exercise cumulative fifteen-record seasonal additions in local Chromium
        if: matrix.suite == 'seasonal-cumulative'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          SEASONAL_CUMULATIVE: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Exercise eleven Astra additions and all previous seasonal receipts in local Chromium
        if: matrix.suite == 'seasonal-astra'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          SEASONAL_ASTRA: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Exercise additional independently cleared Astra records in local Chromium
        if: matrix.suite == 'seasonal-astra-extras'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          SEASONAL_ASTRA_EXTRAS: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Exercise seven independently cleared Phase 4 recovery records in local Chromium
        if: matrix.suite == 'seasonal-phase4'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          SEASONAL_PHASE4: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Exercise independently cleared next Missouri records in local Chromium
        if: matrix.suite == 'seasonal-next-missouri'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          SEASONAL_NEXT_MISSOURI: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Exercise independently cleared Missouri HOLD resolutions in local Chromium
        if: matrix.suite == 'seasonal-hold-cleanup'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          SEASONAL_HOLD_CLEANUP: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Ranked Missouri HOLD browser regression
        if: matrix.suite == 'seasonal-ranked-holds'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          SEASONAL_RANKED_HOLDS: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Exercise exact independently cleared regional twelve
        if: matrix.suite == 'seasonal-regional-wave1'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
          SEASONAL_REGIONAL_WAVE1: "true"
        run: node scripts/seasonal-ten-record-browser.mjs

      - name: Compare seasonal and standard card geometry
        if: matrix.suite == 'geometry'
        env:
          CI: "true"
          VITE_AUTH_ENABLED: "true"
        run: node scripts/seasonal-card-layout-browser.mjs

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casino-browser-evidence-${{ matrix.suite }}
          path: audit/browser-results/
          if-no-files-found: warn
          retention-days: 14

  # The familiar release gate is green only after every independent job passes.
  validate:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
